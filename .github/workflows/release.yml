name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versienummer uit tag halen
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: ZIP aanmaken
        run: |
          mkdir -p build
          rsync -r \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='node_modules' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            ./ build/rankrepair/
          cd build && zip -r rankrepair.zip rankrepair/

      - name: Release-notities uit de changelog halen
        run: |
          awk -v v="${{ steps.version.outputs.VERSION }}" '$0 == "= " v " =" {f=1; next} /^= / {if (f) exit} f' readme.txt > build/notes.md

      - name: GitHub Release aanmaken
        uses: softprops/action-gh-release@v2
        with:
          name: "RankRepair v${{ steps.version.outputs.VERSION }}"
          body_path: build/notes.md
          files: build/rankrepair.zip
          generate_release_notes: true
