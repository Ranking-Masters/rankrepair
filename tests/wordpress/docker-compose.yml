# Wegwerp-WordPress om de Interne Links-keten in een echte omgeving te draaien.
# Zie README.md in deze map.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wp:
    image: wordpress:php8.2-apache
    depends_on:
      db: { condition: service_healthy }
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # Fouten loggen, niet tonen. Met schermuitvoer aan breekt de inlogpagina:
      # de add-ons roepen __() aan bij het laden van de plugin, wat een notice
      # geeft vóór de headers, en dan mislukt de redirect na het inloggen.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
    ports: ["8899:80"]
    volumes:
      - wpdata:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/rankrepair

  cli:
    image: wordpress:cli-php8.2
    depends_on: [wp]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wpdata:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/rankrepair
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wpdata:
